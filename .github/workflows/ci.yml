name: CI

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - production

jobs:
  test:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Create env file
        run: |
          echo "PORT=3000" >> .env
          echo "NODE_ENV=test" >> .env
          echo "MONGO_URI_TEST=${{ secrets.MONGO_URI_TEST }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Build
        run: npm run build

      - name: Start API
        run: |
          NODE_ENV=test npm run start &
          npx wait-on -t 30000 http://127.0.0.1:3000/ok

      - name: Run Playwright tests
        run: npm run test:e2e